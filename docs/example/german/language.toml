# ILLUSTRATIVE copy of german/language.toml so 'python -m tools.schema validate docs/example/german' works.
code = "de"
name = "German"
native_name = "Deutsch"
word_count = 5000                    # ranked forms kept in words.json; books below cover a range
max_reorder = 50                     # learning order may differ from frequency rank by at most this
source = "Tatoeba German sentences (CC BY 2.0 FR); word counts only, course sentences are newly written"
source_url = "https://tatoeba.org"

# One PDF per book: python -m tools.pdf <lang> --book <id>  ->  <lang>/<file>.pdf
[[books]]
id = "1-1000"
title = "The First 1000 German Words"
subtitle = "in learning order, with example sentences and grammar"
file = "first 1000 german words"
first = 1
last = 1000
